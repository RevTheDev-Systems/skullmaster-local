[project]
name = "notebooklm-local"
version = "0.1.0"
description = "Local NotebookLM clone: source-grounded RAG chat with citations, powered by Ollama"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "ollama>=0.4",
    "lancedb>=0.15",
    "pymupdf>=1.24",
    "trafilatura>=1.12",
    "rank-bm25>=0.2.2",
    "python-multipart>=0.0.12",
    "python-dotenv>=1.0",
    "python-docx>=1.1",
    "kokoro-onnx>=0.4",
    "numpy>=1.26",
]

[tool.uv]
package = false
