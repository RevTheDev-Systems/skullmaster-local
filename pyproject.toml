[project]
name = "skullmaster-local"
version = "1.0.0"
description = "SkullMaster iQ: fully local NotebookLM-style app — source-grounded cited chat and audio overviews, powered by Ollama"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "ollama>=0.4",
    "lancedb>=0.15",
    "pymupdf>=1.24",
    "trafilatura>=1.12",
    "rank-bm25>=0.2.2",
    "python-multipart>=0.0.12",
    "python-dotenv>=1.0",
    "python-docx>=1.1",
    "kokoro-onnx>=0.4",
    "numpy>=1.26",
    "faster-whisper>=1.2.1",
    "openpyxl>=3.1.5",
    "httpx>=0.28.1",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=2.3",
    "pytest>=9.1.1",
    "ruff>=0.16",
]
[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100
exclude = [".venv", "models", "data", "evals"]

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]  # line length is handled by the formatter

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
files = ["app"]
ignore_missing_imports = true
