name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv python install 3.12
      - name: Install (dev group)
        run: uv sync --group dev
      - name: Lint
        run: uv run ruff check app tests
      - name: Format check
        run: uv run ruff format --check app tests
      - name: Type check
        run: uv run mypy app
      # Tests use mocked providers and a lexical embedding stub — CI never
      # downloads multi-gigabyte models or requires a local LLM.
      - name: Tests
        run: uv run pytest -q
