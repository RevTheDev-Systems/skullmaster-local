name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}   # allow a manual dry run of packaging

permissions:
  contents: write    # create the GitHub Release
  packages: write    # push the container image to GHCR

jobs:
  source:
    name: Source archive + checksums
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Package tracked source
        run: |
          TAG="${GITHUB_REF_NAME}"
          # git archive includes only tracked files (never .env/data/models).
          git archive --format=tar.gz \
            --prefix="skullmaster-iq-${TAG}/" \
            -o "skullmaster-iq-${TAG}.tar.gz" HEAD
          shasum -a 256 "skullmaster-iq-${TAG}.tar.gz" > SHA256SUMS
          cat SHA256SUMS
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            "skullmaster-iq-${GITHUB_REF_NAME}.tar.gz" SHA256SUMS \
            --title "SkullMaster iQ ${GITHUB_REF_NAME}" \
            --generate-notes
      - name: Upload artifacts (manual runs)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: source-archive
          path: |
            skullmaster-iq-*.tar.gz
            SHA256SUMS

  container:
    name: Container image (GHCR)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ startsWith(github.ref, 'refs/tags/') }}
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.ref_name }}
            ghcr.io/${{ github.repository }}:latest
