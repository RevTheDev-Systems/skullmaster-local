# SkullMaster iQ — Docker Compose.
#
# Inference runs on the host (Ollama), not in the container, so no GPU passthrough
# is needed. Start Ollama on the host and pull your models there:
#
#   ollama serve
#   ollama pull qwen3:4b && ollama pull nomic-embed-text
#   docker compose up --build
#   open http://127.0.0.1:8501
#
# Values fall back to the defaults below; override them in a local .env file.
services:
  skullmaster:
    build: .
    image: skullmaster-iq:local
    ports:
      # Loopback-only, matching the app's local-first default.
      - "127.0.0.1:${PORT:-8501}:8501"
    environment:
      HOST: 0.0.0.0
      PORT: "8501"
      # Reach Ollama running on the host.
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      CHAT_MODEL: ${CHAT_MODEL:-qwen3:4b}
      EMBED_MODEL: ${EMBED_MODEL:-nomic-embed-text}
      TTS_MODEL: ${TTS_MODEL:-kokoro}
      STT_MODEL: ${STT_MODEL:-whisper-base}
      OCR_ENABLED: ${OCR_ENABLED:-auto}
    volumes:
      - ./data:/app/data
      - ./models:/app/models
    extra_hosts:
      # Makes host.docker.internal resolve on Linux as well as macOS/Windows.
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
